# appimage-builder recipe see https://appimage-builder.readthedocs.io for details
version: 1
script:
  - rm -rf AppDir | true
  - mkdir AppDir
  - mkdir -p AppDir/usr/share/icons
AppDir:
  after_bundle:
    - cp build/linux/x64/release/bundle/gitjournal AppDir
    - cp -r build/linux/x64/release/bundle/lib/. AppDir/lib
    - cp -r build/linux/x64/release/bundle/data AppDir
    - cp assets/icon/icon.svg AppDir/usr/share/icons/gitjournal.svg
  path: _CODE_PATH_/AppDir
  app_info:
    id: io.gitjournal.gitjournal
    name: GitJournal
    icon: gitjournal
    version: latest
    exec: gitjournal
    exec_args: $@
  apt:
    # dpkg/apt's architecture name, not the uname/kernel one used below for
    # AppImage.arch — "x86_64" isn't a real dpkg arch, so apt silently
    # matched zero Packages indices and "apt.include" below was a no-op.
    arch: [amd64]
    allow_unauthenticated: true
    # Debian buster is EOL and no longer served from deb.debian.org /
    # security.debian.org (both 404); archive.debian.org keeps EOL releases
    # available indefinitely.
    # [trusted=yes]: archive.debian.org's buster signing keys aren't in the
    # build container's trust store (and won't be, since buster's EOL); apt
    # would otherwise hard-fail on unverifiable InRelease signatures even
    # with allow_unauthenticated above.
    sources:
    - sourceline: deb [trusted=yes] http://archive.debian.org/debian buster main
    - sourceline: deb [trusted=yes] http://archive.debian.org/debian-security buster/updates main
    - sourceline: deb [trusted=yes] http://archive.debian.org/debian buster-updates main
    # libcurl4: sentry-native's crashpad handler links against it dynamically
    # (via sentry_flutter), but neither Flutter's own CMake install() nor
    # this recipe's after_bundle script bundles third-party system libs, so
    # without this the AppImage fails to even start on a system that
    # doesn't already have libcurl4 installed.
    include: [libcurl4]
    exclude:
    - humanity-icon-theme
    - hicolor-icon-theme
    - adwaita-icon-theme
    - ubuntu-mono
  files:
    include: []
    exclude:
    - usr/share/man
    - usr/share/doc/*/README.*
    - usr/share/doc/*/changelog.*
    - usr/share/doc/*/NEWS.*
    - usr/share/doc/*/TODO.*
  runtime:
    env:
      GIO_MODULE_DIR: $APPDIR/usr/lib/x86_64-linux-gnu/gio/modules/
AppImage:
  arch: x86_64
  update-information: guess
